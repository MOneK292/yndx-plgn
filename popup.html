<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
    }
    .section {
      margin-bottom: 12px;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 6px;
      border: 1px solid #404040;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: #f0f0f0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="password"] {
      width: 100%;
      padding: 6px;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 11px;
      box-sizing: border-box;
      background: #404040;
      color: #e0e0e0;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
    }
    input[type="password"]::placeholder {
      color: #999;
    }
    button {
      padding: 6px 10px;
      margin: 3px 2px 0 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    .btn-primary { 
      background: #007bff; 
      color: white; 
    }
    .btn-primary:hover {
      background: #0056b3;
    }
    .btn-success { 
      background: #28a745; 
      color: white; 
    }
    .btn-success:hover {
      background: #1e7e34;
    }
    .btn-secondary { 
      background: #6c757d; 
      color: white; 
    }
    .btn-secondary:hover {
      background: #545b62;
    }
    .btn-danger { 
      background: #dc3545; 
      color: white; 
    }
    .btn-danger:hover {
      background: #c82333;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .checkbox-container:last-child {
      margin-bottom: 0;
    }
    .checkbox-container input[type="checkbox"] {
      margin: 0;
      transform: scale(0.9);
      accent-color: #007bff;
    }
    .checkbox-container label {
      margin: 0;
      font-size: 11px;
      cursor: pointer;
      color: #e0e0e0;
    }
    #stats {
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 8px;
      font-size: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
      margin-top: 6px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      color: #f0f0f0;
    }
    #stats::-webkit-scrollbar {
      width: 6px;
    }
    #stats::-webkit-scrollbar-track {
      background: #333;
    }
    #stats::-webkit-scrollbar-thumb {
      background: #666;
      border-radius: 3px;
    }
    #stats::-webkit-scrollbar-thumb:hover {
      background: #888;
    }
  </style>
</head>
<body>
  <div class="section">
    <button id="togglePlugin" class="btn-danger" style="width: 100%;">Отключить плагин</button>
  </div>
  <div class="section">
    <div class="section-title">Токен</div>
    <input type="password" id="universalToken" placeholder="Универсальный токен">
    <button id="saveUniversalToken" class="btn-primary">Сохранить</button>
    <button id="getCsrfToken" class="btn-secondary">Получить CSRF</button>
  </div>
  <div class="section">
    <div class="section-title">Статистика</div>
    <div class="button-row">
      <button id="fetch" class="btn-success">Получить</button>
      <button id="toggleCounter" class="btn-secondary">Скрыть счетчик</button>
    </div>
    <div id="stats">✅ Выполнено: 0
⏳ В очереди: 0</div>
  </div>
  <div class="section">
    <div class="section-title">Доп функции</div>
    <div class="checkbox-container">
      <input type="checkbox" id="toggleCheckbox">
      <label for="toggleCheckbox">Непрерывная выдача</label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
